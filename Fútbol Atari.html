<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Fútbol Atari</title>
<link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">
<style>
:root{--bg:#000;--fg:#f2f2f2;--dim:#9a9a9a;color-scheme:dark;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#000;--fg:#f2f2f2;--dim:#9a9a9a}}
:root[data-theme="dark"]{--bg:#000;--fg:#f2f2f2;--dim:#9a9a9a}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--fg);font-family:'Press Start 2P',monospace;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:16px;padding:8px;box-sizing:border-box}
.wrap{position:relative;width:min(100%,960px)}
canvas{display:block;width:100%;aspect-ratio:640/420;image-rendering:pixelated;touch-action:none;background:#000;outline:4px solid #2a2a2a}
.wrap::after{content:"";position:absolute;inset:0;pointer-events:none;background:repeating-linear-gradient(0deg,rgba(0,0,0,.18) 0 1px,transparent 1px 3px)}
p{font-size:9px;line-height:2;color:var(--dim);text-align:center;margin:0;max-width:760px}
</style>
</head>
<body>
<div class="wrap"><canvas id="c" width="640" height="420"></canvas></div>
<p>Un jugador: WASD o flechas y Espacio para patear. Dos jugadores: J1 con WASD y Espacio, J2 con flechas y Enter. En el móvil: arrastra a la izquierda para moverte y toca a la derecha para patear.</p>
<script>
const cv=document.getElementById('c'),ctx=cv.getContext('2d');
const W=640,H=420,L=24,R=616,TP=56,B=412,CY=(TP+B)/2,GY1=CY-46,GY2=CY+46;
const C1='#e8782e',C2='#4c78f0';
let mode='menu',solo=true,score=[0,0],frames=7200,pause=0,keys={};
const touch={x:0,y:0,kick:0,id:null,kid:null,ox:0,oy:0};
const ball={x:0,y:0,vx:0,vy:0};
const mk=t=>({t,x:0,y:0,fx:t?-1:1,fy:0,vx:0,vy:0,cool:0});
const P=[mk(0),mk(1)],GK=[mk(0),mk(1)];
let ac;
function beep(f,d,type='square',v=.06){try{ac=ac||new(window.AudioContext||window.webkitAudioContext)();const o=ac.createOscillator(),g=ac.createGain();o.type=type;o.frequency.value=f;g.gain.value=v;o.connect(g);g.connect(ac.destination);o.start();o.stop(ac.currentTime+d)}catch(e){}}
function jingle(a){a.forEach((f,i)=>setTimeout(()=>beep(f,.14),i*130))}

function reset(){
  ball.x=(L+R)/2;ball.y=CY;ball.vx=ball.vy=0;
  P[0].x=L+170;P[1].x=R-170;
  P.forEach(p=>{p.y=CY;p.vx=p.vy=0;p.fx=p.t?-1:1;p.fy=0;p.cool=0});
  GK[0].x=L+14;GK[1].x=R-14;GK.forEach(g=>g.y=CY);
}
function start(n){solo=n===1;score=[0,0];frames=7200;reset();mode='play';jingle([440,660])}
reset();

addEventListener('keydown',e=>{
  keys[e.code]=1;
  if(['Space','ArrowUp','ArrowDown','ArrowLeft','ArrowRight','Enter'].includes(e.code))e.preventDefault();
  if(mode==='menu'){if(e.code==='Digit1'||e.code==='Numpad1')start(1);if(e.code==='Digit2'||e.code==='Numpad2')start(2)}
  else if(mode==='end'&&e.code==='Enter')mode='menu';
  else if(e.code==='Escape')mode='menu';
});
addEventListener('keyup',e=>{keys[e.code]=0});
addEventListener('blur',()=>{keys={}});

function pos(e){const r=cv.getBoundingClientRect();return[(e.clientX-r.left)*W/r.width,(e.clientY-r.top)*H/r.height]}
cv.addEventListener('pointerdown',e=>{
  const[x,y]=pos(e);
  if(mode==='menu'){start(y<285?1:2);return}
  if(mode==='end'){mode='menu';return}
  if(x<W/2){touch.id=e.pointerId;touch.ox=x;touch.oy=y}else{touch.kick=1;touch.kid=e.pointerId}
  try{cv.setPointerCapture(e.pointerId)}catch(_){}
});
cv.addEventListener('pointermove',e=>{
  if(e.pointerId!==touch.id)return;
  const[x,y]=pos(e);let dx=(x-touch.ox)/28,dy=(y-touch.oy)/28;const l=Math.hypot(dx,dy);
  if(l>1){dx/=l;dy/=l}
  touch.x=l<.3?0:dx;touch.y=l<.3?0:dy;
});
function up(e){
  if(e.pointerId===touch.id){touch.id=null;touch.x=touch.y=0}
  if(e.pointerId===touch.kid){touch.kid=null;touch.kick=0}
}
cv.addEventListener('pointerup',up);cv.addEventListener('pointercancel',up);

const axis=(n,p)=>(keys[p]?1:0)-(keys[n]?1:0);
const clamp=(v,a,b)=>Math.max(a,Math.min(b,v));
function human(i){
  let dx,dy,k;
  if(i===0){
    dx=axis('KeyA','KeyD')+touch.x;dy=axis('KeyW','KeyS')+touch.y;k=keys.Space||touch.kick;
    if(solo){dx+=axis('ArrowLeft','ArrowRight');dy+=axis('ArrowUp','ArrowDown');k=k||keys.Enter}
  }else{
    dx=axis('ArrowLeft','ArrowRight');dy=axis('ArrowUp','ArrowDown');k=keys.Enter;
  }
  return{dx:clamp(dx,-1,1),dy:clamp(dy,-1,1),k:!!k};
}

function move(p,dx,dy,k,sp,aim){
  const l=Math.hypot(dx,dy);
  if(l>0){dx/=l;dy/=l;p.fx=dx;p.fy=dy}
  if(aim){p.fx=aim[0];p.fy=aim[1]}
  p.vx=dx*sp;p.vy=dy*sp;
  p.x=clamp(p.x+p.vx,L+8,R-8);p.y=clamp(p.y+p.vy,TP+12,B-12);
  if(p.cool>0)p.cool--;
  const ex=ball.x-p.x,ey=ball.y-p.y,d=Math.hypot(ex,ey)||1;
  if(k&&p.cool===0&&d<28){ball.vx=p.fx*9.2;ball.vy=p.fy*9.2;p.cool=16;beep(220,.06)}
  else if(d<15&&!(ball.ign>0)){
    const nx=ex/d,ny=ey/d;
    ball.x=p.x+nx*15;ball.y=p.y+ny*15;
    ball.vx=nx*1.8+p.vx*1.5;ball.vy=ny*1.8+p.vy*1.5;
  }
}

function cpu(p){
  const gx=p.t?L:R;
  let ax=gx-ball.x,ay=CY-ball.y;const al=Math.hypot(ax,ay)||1;ax/=al;ay/=al;
  const rel=(p.x-ball.x)*ax+(p.y-ball.y)*ay,d=Math.hypot(ball.x-p.x,ball.y-p.y);
  let tx,ty;
  if(rel<-3&&d<300){tx=ball.x;ty=ball.y}else{tx=ball.x-ax*24;ty=ball.y-ay*24}
  let dx=tx-p.x,dy=ty-p.y;
  if(Math.hypot(dx,dy)<3){dx=0;dy=0}
  const k=d<26&&rel<-1;
  let aim=null;
  if(k){const a=Math.atan2(ay,ax)+(Math.random()-.5)*.35;aim=[Math.cos(a),Math.sin(a)]}
  move(p,dx,dy,k,2.15,aim);
}

function goalie(g){
  const ty=clamp(ball.y,GY1+2,GY2-2);
  g.y+=clamp(ty-g.y,-2.1,2.1);
  const dir=g.t?-1:1;
  if(Math.abs(ball.x-g.x)<10&&Math.abs(ball.y-g.y)<16){
    ball.vx=dir*Math.max(5,Math.abs(ball.vx)*.9);
    ball.vy+=(ball.y-g.y)*.15;
    ball.x=g.x+dir*11;beep(140,.05);
  }
}

function stepBall(){
  const r=5;
  ball.x+=ball.vx;ball.y+=ball.vy;ball.vx*=.986;ball.vy*=.986;
  if(Math.hypot(ball.vx,ball.vy)<.05)ball.vx=ball.vy=0;
  if(ball.y<TP+r){ball.y=TP+r;ball.vy=Math.abs(ball.vy)*.8}
  if(ball.y>B-r){ball.y=B-r;ball.vy=-Math.abs(ball.vy)*.8}
  const open=ball.y>GY1+r&&ball.y<GY2-r;
  if(ball.x<L){if(open){if(ball.x<L-6)return 1}else{ball.x=L;ball.vx=Math.abs(ball.vx)*.8}}
  if(ball.x>R){if(open){if(ball.x>R+6)return 0}else{ball.x=R;ball.vx=-Math.abs(ball.vx)*.8}}
  if(ball.ign>0)ball.ign--;
  const nearC=(ball.x<L+14||ball.x>R-14)&&(ball.y<TP+14||ball.y>B-14);
  if(nearC){
    if((ball.st=(ball.st||0)+1)>15){ball.vx=(ball.x<(L+R)/2?1:-1)*4;ball.vy=(ball.y<CY?1:-1)*3;ball.st=0;ball.ign=14;beep(180,.05)}
  }else ball.st=0;
  return -1;
}

function step(){
  if(mode==='goal'){
    ball.vx*=.7;ball.vy*=.7;
    if(--pause<=0){if(frames<=0){mode='end';jingle([330,330,220])}else{reset();mode='play'}}
    return;
  }
  if(mode!=='play')return;
  const h0=human(0);move(P[0],h0.dx,h0.dy,h0.k,2.6);
  if(solo)cpu(P[1]);else{const h1=human(1);move(P[1],h1.dx,h1.dy,h1.k,2.6)}
  GK.forEach(goalie);
  const s=stepBall();
  if(s>=0){score[s]++;mode='goal';pause=110;jingle([523,659,784,1046])}
  if(--frames<=0&&mode==='play'){mode='end';jingle([330,330,220])}
}

function txt(t,x,y,size,col,al='center'){
  ctx.font=size+"px 'Press Start 2P',monospace";ctx.textAlign=al;ctx.textBaseline='middle';ctx.fillStyle=col;ctx.fillText(t,x,y);
}
function drawField(){
  ctx.fillStyle='#000';ctx.fillRect(0,0,W,H);
  for(let x=L,i=0;x<R;x+=44,i++){ctx.fillStyle=i%2?'#238a3c':'#1e7a36';ctx.fillRect(x,TP,Math.min(44,R-x),B-TP)}
  ctx.fillStyle='#161616';
  ctx.fillRect(4,GY1,L-4,GY2-GY1);ctx.fillRect(R,GY1,L-4,GY2-GY1);
  ctx.strokeStyle='#555';ctx.lineWidth=1;
  for(let y=GY1;y<=GY2;y+=8){ctx.beginPath();ctx.moveTo(4,y);ctx.lineTo(L,y);ctx.moveTo(R,y);ctx.lineTo(R+L-4,y);ctx.stroke()}
  ctx.strokeStyle='#f2f2f2';ctx.lineWidth=3;
  ctx.strokeRect(L,TP,R-L,B-TP);
  ctx.beginPath();ctx.moveTo((L+R)/2,TP);ctx.lineTo((L+R)/2,B);ctx.stroke();
  ctx.beginPath();ctx.arc((L+R)/2,CY,44,0,7);ctx.stroke();
  ctx.strokeRect(L,CY-72,56,144);ctx.strokeRect(R-56,CY-72,56,144);
  ctx.fillStyle='#fff';
  [GY1,GY2].forEach(y=>{ctx.fillRect(L-4,y-3,6,6);ctx.fillRect(R-2,y-3,6,6)});
}
function sprite(x,y,col,dark,keeper){
  x=Math.round(x);y=Math.round(y);
  if(keeper){ctx.fillStyle=col;ctx.fillRect(x-4,y-13,8,26);ctx.fillStyle='#f4c79a';ctx.fillRect(x-3,y-17,6,5);return}
  ctx.fillStyle=dark;ctx.fillRect(x-5,y+5,4,7);ctx.fillRect(x+1,y+5,4,7);
  ctx.fillStyle=col;ctx.fillRect(x-6,y-6,12,11);
  ctx.fillStyle='#f4c79a';ctx.fillRect(x-3,y-12,6,6);
}
function drawHUD(){
  txt('J1  '+score[0],24,28,16,C1,'left');
  txt(score[1]+'  '+(solo?'CPU':'J2'),W-24,28,16,C2,'right');
  const s=Math.max(0,Math.ceil(frames/60)),m=Math.floor(s/60);
  const low=s<=10&&Math.floor(performance.now()/300)%2;
  txt(m+':'+String(s%60).padStart(2,'0'),W/2,28,18,low?'#ff4a3a':'#f2f2f2');
}
function draw(){
  drawField();
  GK.forEach(g=>sprite(g.x,g.y,g.t?'#9db6ff':'#f5b04a','',true));
  P.forEach(p=>{
    sprite(p.x,p.y,p.t?C2:C1,p.t?'#233a85':'#8a4210');
    ctx.fillStyle='rgba(255,255,255,.8)';ctx.fillRect(Math.round(p.x+p.fx*16)-1,Math.round(p.y+p.fy*16)-1,3,3);
  });
  ctx.fillStyle='rgba(0,0,0,.35)';ctx.fillRect(Math.round(ball.x)-3,Math.round(ball.y)-1,8,8);
  ctx.fillStyle='#fff';ctx.fillRect(Math.round(ball.x)-4,Math.round(ball.y)-4,8,8);
  drawHUD();
  if(mode==='goal'){
    txt('¡GOL!',W/2,CY,56,Math.floor(performance.now()/120)%2?C1:C2);
  }
  if(mode==='menu'){
    ctx.fillStyle='rgba(0,0,0,.72)';ctx.fillRect(0,0,W,H);
    txt('FÚTBOL',W/2+4,94,46,C2);txt('FÚTBOL',W/2,90,46,C1);
    txt('PARTIDO DE 2 MINUTOS',W/2,150,12,'#f2f2f2');
    [['[1] UN JUGADOR',220],['[2] DOS JUGADORES',290]].forEach(([t,y],i)=>{
      ctx.strokeStyle=i?C2:C1;ctx.lineWidth=4;ctx.strokeRect(140,y,360,50);
      txt(t,W/2,y+26,16,'#f2f2f2');
    });
    txt('Toca o pulsa 1 o 2',W/2,378,10,'#9a9a9a');
  }
  if(mode==='end'){
    ctx.fillStyle='rgba(0,0,0,.78)';ctx.fillRect(0,0,W,H);
    const a=score[0],b=score[1];
    const res=a>b?(solo?'¡GANASTE!':'GANA J1'):b>a?(solo?'GANA LA MÁQUINA':'GANA J2'):'EMPATE';
    txt('FIN DEL TIEMPO',W/2,110,20,'#f2f2f2');
    txt(a+' - '+b,W/2,190,48,'#f2f2f2');
    txt(res,W/2,260,22,a>b?C1:b>a?C2:'#f2f2f2');
    txt('ENTER O TOCA PARA VOLVER',W/2,340,11,'#9a9a9a');
  }
}

let last=0,acc=0;
function frame(t){
  acc+=Math.min(t-last,100);last=t;
  while(acc>=16.667){step();acc-=16.667}
  draw();requestAnimationFrame(frame);
}
requestAnimationFrame(frame);
</script>
</body>
</html>
